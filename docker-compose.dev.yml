services:
  postgres:
    image: postgres:17-alpine
    container_name: DGD-Dev-PostgreSQL
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /mnt/user/appdata/dgd-dev-postgres:/var/lib/postgresql/data
    ports:
      - "55432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - dgd-dev

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: DGD-Dev-Backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTO_SEED: ${AUTO_SEED}
      UPDATER_URL: http://127.0.0.1:65535
      UPDATER_TOKEN: ""
    volumes:
      - ./backend/app:/app/app
    ports:
      - "18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dgd-dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: DGD-Dev-Frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - dgd-dev-node-modules:/app/node_modules
    ports:
      - "15173:5173"
    depends_on:
      - backend
    networks:
      - dgd-dev

networks:
  dgd-dev:
    name: dgd-dev

volumes:
  dgd-dev-node-modules:
