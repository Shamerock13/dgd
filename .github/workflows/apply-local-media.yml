name: Apply local media package
on:
  push:
    branches: [feature/local-media-upload-1]
    paths:
      - tools/apply_local_media.py
      - .github/workflows/apply-local-media.yml
permissions:
  contents: write
jobs:
  apply-validate-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/local-media-upload-1
          fetch-depth: 0
      - run: python tools/apply_local_media.py
      - run: python -m compileall -q backend/app
      - working-directory: frontend
        run: |
          npm install
          npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-local-media.yml tools/apply_local_media.py
          git add backend/app/main.py backend/app/media_routes.py frontend/src/main.jsx frontend/src/media-upload.jsx frontend/src/media-upload.css docker-compose.dev.yml docs/PROJECT_CONTEXT.md docs/ROADMAP.md docs/DEV_WORKFLOW.md
          git commit -m "feat: add local media upload and storage"
          git push origin feature/local-media-upload-1
