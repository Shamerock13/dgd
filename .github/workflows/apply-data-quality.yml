name: Apply data quality worklist

on:
  push:
    branches:
      - feature/data-quality-worklist-1
    paths:
      - tools/data-quality-trigger.txt
      - tools/apply_data_quality.py
      - .github/workflows/apply-data-quality.yml

permissions:
  contents: write

jobs:
  apply-validate-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/data-quality-worklist-1
          fetch-depth: 0
      - name: Apply package
        run: python tools/apply_data_quality.py
      - name: Validate backend
        run: python -m compileall -q backend/app
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
      - name: Commit generated package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-data-quality.yml tools/apply_data_quality.py tools/data-quality-trigger.txt
          git add backend/app/main.py backend/app/quality_routes.py frontend/src/main.jsx frontend/src/quality.jsx frontend/src/quality.css docs/PROJECT_CONTEXT.md docs/ROADMAP.md docs/DEV_WORKFLOW.md
          git commit -m "feat: add editorial data quality worklist"
          git push origin feature/data-quality-worklist-1
