name: Finalize detail view package

on:
  push:
    branches:
      - feature/detail-view-2
    paths:
      - tools/finalize-detail-trigger.txt
  pull_request:
    branches:
      - main
    paths:
      - tools/finalize-detail-trigger.txt

permissions:
  contents: write

jobs:
  validate-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/detail-view-2
          fetch-depth: 0
      - name: Validate frontend build
        working-directory: frontend
        run: |
          npm install
          npm run build
      - name: Remove temporary implementation files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-detail-view.yml tools/apply_detail_view.py tools/detail-trigger.txt tools/finalize-detail-trigger.txt
          git add frontend/src/main.jsx frontend/src/detail.css
          git commit -m "chore: finalize fragrance detail view package"
          git push origin feature/detail-view-2
