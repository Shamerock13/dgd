name: DGD CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile backend
        run: python -m compileall -q backend/app
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser extension
        run: |
          test -f backend/app/browser_extension/manifest.json
          test -f backend/app/browser_extension/popup.html
          test -f backend/app/browser_extension/options.html
          node --check backend/app/browser_extension/popup.js
          node --check backend/app/browser_extension/options.js
          node -e "const fs=require('fs'); const manifest=JSON.parse(fs.readFileSync('backend/app/browser_extension/manifest.json','utf8')); if(manifest.manifest_version!==3) throw new Error('Manifest V3 erforderlich');"
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
