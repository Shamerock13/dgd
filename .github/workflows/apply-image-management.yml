name: Apply image management package

on:
  push:
    branches:
      - feature/image-management-1
    paths:
      - tools/image-management-trigger.txt

permissions:
  contents: write

jobs:
  apply-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/image-management-1
          fetch-depth: 0
      - name: Apply package
        run: python tools/apply_image_management.py
      - name: Validate Python sources
        run: python -m compileall -q backend/app
      - name: Validate frontend build
        working-directory: frontend
        run: |
          npm install
          npm run build
      - name: Commit package and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-image-management.yml tools/apply_image_management.py tools/image-management-trigger.txt
          git add backend/app/models.py backend/app/schemas.py backend/app/migrations.py backend/app/import_service.py backend/app/master_import_service.py frontend/src/main.jsx frontend/src/image.css docs/PROJECT_CONTEXT.md docs/ROADMAP.md docs/DEV_WORKFLOW.md
          git commit -m "feat: add image management and source metadata"
          git push origin feature/image-management-1
